name: Android runtime smoke build

on:
  push:
    branches:
      - android-port
    paths:
      - ".github/workflows/android-runtime-smoke.yml"
      - "PS2Recomp"
      - "PS2Recomp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime:
    name: Build generic Android runtime (no game data)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Initialize only the PS2Recomp submodule
        run: git submodule update --init PS2Recomp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper and build runtime APK
        working-directory: PS2Recomp/android
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload generic runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: hctp-android-runtime-shell
          path: PS2Recomp/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
